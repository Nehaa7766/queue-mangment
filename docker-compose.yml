# Everything runs in Docker; the host only needs Docker.
#   Dev server:         docker compose up --watch          -> http://localhost:3000
#   Lint, types, tests: docker compose exec app npm run lint | typecheck | test
#   Production + E2E:   docker compose --profile test run --rm e2e
name: queuecare

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: queuecare
      POSTGRES_PASSWORD: queuecare
      POSTGRES_DB: queuecare_dev
    ports:
      # 5442 on the host avoids clashing with a locally installed PostgreSQL.
      - "${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuecare -d queuecare_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development server with hot reload.
  app:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://queuecare:queuecare@db:5432/queuecare_dev
      TEST_DATABASE_URL: postgresql://queuecare:queuecare@db:5432/queuecare_test
      # Development-only secret; production sets a real one.
      BETTER_AUTH_SECRET: dev-only-secret-change-me-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      INTERNAL_JOB_SECRET: dev-only-job-secret-0123456789abcdef0123
    depends_on:
      db:
        condition: service_healthy
    develop:
      # Compose Watch copies edits into the container. This works on Windows,
      # where file-change events from bind mounts don't reach the container.
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - src/generated/
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: prisma/schema.prisma

  # Sends queued emails by calling the outbox endpoint every 10 seconds.
  worker:
    image: curlimages/curl:8.11.1
    environment:
      INTERNAL_JOB_SECRET: dev-only-job-secret-0123456789abcdef0123
      OUTBOX_URL: http://app:3000/api/internal/outbox/process
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$INTERNAL_JOB_SECRET" "$$OUTBOX_URL" -o /dev/null || echo "outbox run failed"
          sleep 10
        done
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Clears old patient names once a day (docs/PRIVACY.md).
  retention:
    image: curlimages/curl:8.11.1
    environment:
      INTERNAL_JOB_SECRET: dev-only-job-secret-0123456789abcdef0123
      RETENTION_URL: http://app:3000/api/internal/retention/run
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 60
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$INTERNAL_JOB_SECRET" "$$RETENTION_URL" -o /dev/null || echo "retention run failed"
          sleep 86400
        done
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Production image, used for end-to-end tests.
  web:
    profiles: [test]
    build:
      context: .
      target: runner
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://queuecare:queuecare@db:5432/queuecare_test
      BETTER_AUTH_SECRET: test-only-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://web:3000
      INTERNAL_JOB_SECRET: test-only-job-secret-0123456789abcdef0123
      # As if behind a reverse proxy, so each E2E spec can sign in as its own
      # client address instead of sharing one sign-in rate limit.
      TRUSTED_IP_HEADER: x-forwarded-for
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  e2e:
    profiles: [test]
    build:
      context: .
      target: e2e
    environment:
      E2E_BASE_URL: http://web:3000
      CI: ${CI:-}
    volumes:
      - ./playwright-report:/e2e/playwright-report
      - ./test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
