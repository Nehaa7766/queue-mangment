name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start database and dev container
        run: docker compose up --detach --build --wait db app

      - name: Lint
        run: docker compose exec -T app npm run lint

      - name: Type-check
        run: docker compose exec -T app npm run typecheck

      - name: Format check
        run: docker compose exec -T app npm run format:check

      - name: Migrate and seed the test database
        run: docker compose exec -T app sh -c 'DATABASE_URL=$TEST_DATABASE_URL npm run db:deploy && DATABASE_URL=$TEST_DATABASE_URL npx prisma db seed'

      - name: Unit and integration tests
        run: docker compose exec -T app npm test

      - name: Build production image and E2E image
        run: docker compose --profile test build web e2e

      - name: End-to-end tests against the production build
        run: docker compose --profile test run --rm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose --profile test logs

      - name: Stop containers
        if: always()
        run: docker compose --profile test down --volumes
